<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectMe Chat</title>
<style>
  body{font-family:Arial;background:#f0f2f5;margin:0;display:flex;justify-content:center}
  .box{width:100%;max-width:450px;height:100vh;background:white;display:flex;flex-direction:column}
  .header{background:#075e54;color:white;padding:15px;text-align:center;font-weight:bold}
  #messages{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .msg{padding:10px 12px;border-radius:12px;max-width:75%;font-size:14px;word-wrap:break-word}
  .me{background:#dcf8c6;align-self:flex-end}
  .other{background:#eee;align-self:flex-start}
  .name{font-size:11px;color:#555;margin-bottom:3px}
  .input-area{display:flex;padding:10px;border-top:1px solid #ddd;gap:8px}
  input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px;outline:none}
  button{background:#075e54;color:white;border:none;padding:10px 18px;border-radius:20px;cursor:pointer}
  .setup{padding:15px;display:flex;flex-direction:column;gap:10px}
  .setup input{border-radius:8px}
  .myid{background:#eef;padding:10px;border-radius:8px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="header">ConnectMe Chat</div>
  <div class="setup" id="setup">
    <input id="userName" placeholder="Your Name e.g. Victor" />
    <div class="myid">Your ID: <b id="myIdText">Connecting...</b><br>Send this ID to your friend</div>
    <input id="friendId" placeholder="Paste your friend's ID here" />
    <button onclick="connectFriend()">Connect to Friend</button>
    <div id="status" style="text-align:center;font-size:13px;color:#555">Waiting for connection...</div>
  </div>
  <div id="messages" style="display:none"></div>
  <div class="input-area" id="inputArea" style="display:none">
    <input id="msgInput" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  let myName = "";
  let conn = null;
  const messagesDiv = document.getElementById("messages");

  const peer = new Peer();
  peer.on('open', (id) => {
    document.getElementById("myIdText").innerText = id;
  });

  peer.on('connection', (c) => {
    setupConn(c);
  });

  function setupConn(c) {
    conn = c;
    document.getElementById("status").innerText = "Connected! ✅ You can chat now";
    document.getElementById("messages").style.display = "flex";
    document.getElementById("inputArea").style.display = "flex";
    conn.on('data', (data) => {
      addMessage(data.name, data.text, false);
    });
  }

  function connectFriend() {
    myName = document.getElementById("userName").value.trim();
    const friendId = document.getElementById("friendId").value.trim();
    if(!myName) return alert("Enter your name first");
    if(!friendId) return alert("Paste your friend's ID");
    const c = peer.connect(friendId);
    c.on('open', () => setupConn(c));
  }

  function addMessage(name, text, isMe) {
    const div = document.createElement("div");
    div.className = "msg " + (isMe ? "me" : "other");
    div.innerHTML = `<div class="name">${name}</div>${text}`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function sendMessage() {
    myName = document.getElementById("userName").value.trim() || "Me";
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if(!text || !conn) return;
    addMessage(myName, text, true);
    conn.send({ name: myName, text: text });
    input.value = "";
  }

  document.getElementById("msgInput").addEventListener("keypress", (e)=>{
    if(e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
