
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectMe - Chat Together</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:#fff;
}
.container{
  max-width:600px;
  min-height:100vh;
  margin:auto;
  background:#172337;
  display:flex;
  flex-direction:column;
}
header{
  padding:20px;
  background:#075e54;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h2{margin:0;font-size:23px}
header small{color:#d7f5ed}
.panel{padding:20px}
input{
  width:100%;
  padding:14px;
  border:1px solid #394b62;
  border-radius:9px;
  margin:7px 0;
  background:#24344b;
  color:white;
  font-size:15px;
}
button{
  padding:13px;
  border:0;
  border-radius:9px;
  background:#08a884;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin:5px 0;
}
button:disabled{opacity:.5}
.full{width:100%}
.secondary{background:#34465e}
.danger{background:#b93848}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;padding:12px}
.tabs button{flex:1}
#messages{
  height:48vh;
  overflow-y:auto;
  padding:15px;
  background:#101b2c;
}
.msg{
  max-width:85%;
  padding:11px;
  border-radius:12px;
  margin:9px 0;
  background:#34445b;
  overflow-wrap:anywhere;
}
.msg.me{
  margin-left:auto;
  background:#087c65;
}
.msg small{
  display:block;
  color:#c6d8e5;
  font-size:11px;
  margin-bottom:5px;
}
.composer{
  display:flex;
  gap:7px;
  padding:12px;
  background:#172337;
}
.composer input{margin:0}
.composer button{min-width:75px}
.status{
  color:#a9c4d5;
  font-size:13px;
  padding:8px 15px;
}
.card{
  background:#24344b;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}
#notice{color:#ffc76c;padding:10px;font-size:13px}
</style>
</head>

<body>
<div class="container">

<header>
  <div>
    <h2>ConnectMe 💬</h2>
    <small>Connect. Chat. Make Friends.</small>
  </div>
  <button id="logoutBtn" class="danger hidden">Logout</button>
</header>

<!-- LOGIN AND REGISTRATION -->
<section id="authSection" class="panel">
  <h2>Welcome to ConnectMe</h2>
  <p>Create an account or sign in to start chatting.</p>

  <input id="name" placeholder="Your full name">
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password (minimum 6 characters)">

  <button class="full" id="registerBtn">Create Account</button>
  <button class="full secondary" id="loginBtn">Login</button>
  <div id="authMessage" class="status"></div>
</section>

<!-- MAIN APPLICATION -->
<section id="appSection" class="hidden">

  <div class="panel">
    <h3>Welcome, <span id="userDisplay">Friend</span> 👋</h3>
    <div class="status" id="connectionStatus">Connected to ConnectMe</div>
  </div>

  <div class="tabs">
    <button id="publicTab">🌍 Public Chat</button>
    <button id="privateTab" class="secondary">🔒 Private Chat</button>
  </div>

  <!-- PUBLIC CHAT -->
  <section id="publicSection">
    <div id="messages"></div>
    <div class="composer">
      <input id="publicInput" placeholder="Write a public message...">
      <button id="publicSend">Send</button>
    </div>
  </section>

  <!-- PRIVATE CHAT -->
  <section id="privateSection" class="hidden panel">

    <div class="card">
      <h3>Create Private Room</h3>
      <p>Create a private room and share its invitation code.</p>
      <button class="full" id="createRoomBtn">Create Room</button>
    </div>

    <div class="card">
      <h3>Join Private Room</h3>
      <input id="roomCodeInput" placeholder="Enter invitation code">
      <button class="full" id="joinRoomBtn">Join Room</button>
    </div>

    <div id="roomInfo" class="card hidden">
      <p>Current private room:</p>
      <strong id="roomCodeDisplay"></strong>
      <button class="full secondary" id="copyCodeBtn">Copy Invitation Code</button>
      <button class="full danger" id="leaveRoomBtn">Leave Room</button>
    </div>

    <div id="privateMessages"></div>

    <div id="privateComposer" class="composer hidden">
      <input id="privateInput" placeholder="Write a private message...">
      <button id="privateSend">Send</button>
    </div>
  </section>

  <div id="notice"></div>

</section>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

// YOUR FIREBASE CONFIGURATION
const firebaseConfig = {
  apiKey: "AIzaSyBG6uHtmXNBmuEE2h_4gEUEIn07ecgKqmM",
  authDomain: "meandyou-8b691.firebaseapp.com",
  databaseURL: "https://meandyou-8b691-default-rtdb.firebaseio.com",
  projectId: "meandyou-8b691",
  storageBucket: "meandyou-8b691.firebasestorage.app",
  messagingSenderId: "105563637881",
  appId: "1:105563637881:web:03149e75ee6516cda4eca8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let currentRoom = null;
let publicListener = null;
let privateListener = null;

const $ = id => document.getElementById(id);

function notice(message){
  $("notice").textContent = message;
}

function showError(error, element){
  $(element).textContent = error.message || "Something went wrong.";
}

// REGISTRATION
$("registerBtn").onclick = async () => {
  const name = $("name").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!name || !email || password.length < 6){
    showError({message:"Enter your name, valid email and password of at least 6 characters."},"authMessage");
    return;
  }

  try{
    const result = await auth.createUserWithEmailAndPassword(email,password);
    await result.user.updateProfile({displayName:name});

    await db.ref("profiles/"+result.user.uid).set({
      name:name,
      email:email
    });

    $("authMessage").textContent = "Account created successfully!";
  }catch(error){
    showError(error,"authMessage");
  }
};

// LOGIN
$("loginBtn").onclick = async () => {
  try{
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
  }catch(error){
    showError(error,"authMessage");
  }
};

// AUTHENTICATION STATE
auth.onAuthStateChanged(async user => {
  currentUser = user;

  if(user){
    $("authSection").classList.add("hidden");
    $("appSection").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");

    const profile = await db.ref("profiles/"+user.uid).get();
    const savedName = profile.exists() ? profile.val().name : "";

    $("userDisplay").textContent =
      savedName || user.displayName || "Friend";

    startPublicChat();
  }else{
    stopListeners();
    currentRoom = null;

    $("authSection").classList.remove("hidden");
    $("appSection").classList.add("hidden");
    $("logoutBtn").classList.add("hidden");
  }
});

// LOGOUT
$("logoutBtn").onclick = () => {
  auth.signOut();
};

// MESSAGE DISPLAY
function addMessage(container,data){
  const div = document.createElement("div");
  div.className = "msg";

  if(data.uid === currentUser.uid){
    div.classList.add("me");
  }

  const name = document.createElement("small");
  name.textContent = data.name || "Friend";

  const message = document.createElement("div");
  message.textContent = data.text || "";

  const time = document.createElement("small");
  time.textContent = data.createdAt
    ? new Date(data.createdAt).toLocaleTimeString()
    : "";

  div.append(name,message,time);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function stopListeners(){
  if(publicListener){
    publicListener.off();
    publicListener = null;
  }

  if(privateListener){
    privateListener.off();
    privateListener = null;
  }
}

// PUBLIC CHAT
function startPublicChat(){
  if(publicListener) publicListener.off();

  $("messages").replaceChildren();

  publicListener = db.ref("publicChat")
    .orderByChild("createdAt")
    .limitToLast(100);

  publicListener.on("value",snapshot => {
    $("messages").replaceChildren();

    snapshot.forEach(child => {
      addMessage($("messages"),child.val());
    });
  },error => notice(error.message));
}

async function sendPublicMessage(){
  const text = $("publicInput").value.trim();

  if(!text || !currentUser) return;

  try{
    const profile = await db.ref("profiles/"+currentUser.uid).get();
    const name = profile.exists()
      ? profile.val().name
      : currentUser.displayName || "Friend";

    await db.ref("publicChat").push({
      uid:currentUser.uid,
      name:name,
      text:text,
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });

    $("publicInput").value = "";
    notice("");
  }catch(error){
    notice(error.message);
  }
}

$("publicSend").onclick = sendPublicMessage;

$("publicInput").addEventListener("keydown",e => {
  if(e.key === "Enter") sendPublicMessage();
});

// SWITCH CHAT TABS
$("publicTab").onclick = () => {
  $("publicSection").classList.remove("hidden");
  $("privateSection").classList.add("hidden");
  $("publicTab").classList.remove("secondary");
  $("privateTab").classList.add("secondary");
};

$("privateTab").onclick = () => {
  $("publicSection").classList.add("hidden");
  $("privateSection").classList.remove("hidden");
  $("privateTab").classList.remove("secondary");
  $("publicTab").classList.add("secondary");
};

// PRIVATE ROOM
function generateCode(){
  return "CM" + Math.random().toString(36)
    .substring(2,10).toUpperCase();
}

async function enterRoom(code){
  code = code.trim().toUpperCase();

  if(!/^[A-Z0-9]{6,20}$/.test(code)){
    notice("Invalid invitation code.");
    return;
  }

  try{
    // Knowing the invitation code grants permission to join.
    await db.ref("privateRooms/"+code+"/members/"+currentUser.uid)
      .set(true);

    if(privateListener) privateListener.off();

    currentRoom = code;

    $("roomInfo").classList.remove("hidden");
    $("privateComposer").classList.remove("hidden");
    $("roomCodeDisplay").textContent = code;
    $("privateMessages").replaceChildren();

    privateListener = db.ref("privateRooms/"+code+"/messages")
      .orderByChild("createdAt")
      .limitToLast(100);

    privateListener.on("value",snapshot => {
      $("privateMessages").replaceChildren();

      snapshot.forEach(child => {
        addMessage($("privateMessages"),child.val());
      });
    },error => notice(error.message));

    notice("You joined private room "+code);
  }catch(error){
    notice(error.message);
  }
}

// CREATE ROOM
$("createRoomBtn").onclick = async () => {
  const code = generateCode();
  await enterRoom(code);
};

// JOIN ROOM
$("joinRoomBtn").onclick = () => {
  const code = $("roomCodeInput").value;
  enterRoom(code);
};

// PRIVATE MESSAGE
async function sendPrivateMessage(){
  if(!currentRoom) return;

  const text = $("privateInput").value.trim();
  if(!text) return;

  try{
    const profile = await db.ref("profiles/"+currentUser.uid).get();
    const name = profile.exists()
      ? profile.val().name
      : currentUser.displayName || "Friend";

    await db.ref("privateRooms/"+currentRoom+"/messages").push({
      uid:currentUser.uid,
      name:name,
      text:text,
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });

    $("privateInput").value = "";
    notice("");
  }catch(error){
    notice(error.message);
  }
}

$("privateSend").onclick = sendPrivateMessage;

$("privateInput").addEventListener("keydown",e => {
  if(e.key === "Enter") sendPrivateMessage();
});

// COPY INVITATION CODE
$("copyCodeBtn").onclick = async () => {
  try{
    await navigator.clipboard.writeText(currentRoom);
    notice("Invitation code copied!");
  }catch(error){
    notice("Your invitation code is: "+currentRoom);
  }
};

// LEAVE ROOM
$("leaveRoomBtn").onclick = () => {
  if(privateListener) privateListener.off();

  privateListener = null;
  currentRoom = null;

  $("roomInfo").classList.add("hidden");
  $("privateComposer").classList.add("hidden");
  $("privateMessages").replaceChildren();

  notice("You left the private room.");
};

</script>
</body>
</html>
